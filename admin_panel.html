<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Admin</title>
    
    <!-- Favicon (Logo de la pestaña del navegador) -->
    <link rel="icon" href="recursos/logo.png" type="image/png">

    <!-- Estilos -->
    <link rel="stylesheet" href="css/admin_panel.css">

    <!-- Librería Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="admin-panel-container">
        <!-- Barra de navegación -->
        <div class="navbar">
            <!-- Botón Principal -->
            <button class="nav-btn" onclick="updateContent('principal')">Principal</button>

            <!-- Menú Admin -->
            <div class="nav-btn-container">
                <button class="nav-btn">Admin</button>
                <div class="dropdown-content">
                    <a href="#" onclick="updateContent('empleados')"><button>Empleados</button></a>
                    <a href="#" onclick="updateContent('usuarios')"><button>Usuarios</button></a>
                    <a href="#" onclick="updateContent('registro')"><button>Registro</button></a>
                </div>
            </div>

            <!-- Menú Configuración -->
            <div class="nav-btn-container">
                <button class="nav-btn">Configuración</button>
                <div class="dropdown-content">
                    <a href="#" onclick="updateContent('roles')"><button>Roles</button></a>
                    <a href="#" onclick="updateContent('permisos_roles')"><button>Permisos y Roles</button></a>
                </div>
            </div>

            <button class="nav-btn" onclick="logout()">Cerrar sesión</button>
        </div>

        <!-- Sección Principal con el Logo y mensaje de Bienvenida -->
        <div id="main" class="section">
            <div id="welcome-message">
                <div class="logo-container">
                    <img src="recursos/logo.png" alt="Logo" class="logo">
                </div>
            </div>

            <div id="dynamicContent">
                <h1>Bienvenido al Panel de Administración</h1>
            </div>
        </div>
    </div>

    <script src="js/admin_panel.js"></script>
</body>
</html>
